<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FizzBuzz List</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="container">
    <h2>FizzBuzz Generator</h2>
    <div class="controls">
      <label for="limitInput">Upper Limit:</label>
      <input type="number" id="limitInput" value="30" min="1">
      <button id="generateBtn">Generate List</button>
    </div>
    <ul id="fizzList"></ul>
  </div>
</body>
</html>
